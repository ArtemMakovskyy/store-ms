# ========== General Settings ==========
spring.application.name=api-gateway
server.port=8080

# ======== Eureka Client: Registration and Discovery ========
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.username=eureka
eureka.client.password=password
eureka.instance.prefer-ip-address=true

# ======== Gateway: Automatic Service Routes via Discovery ========
spring.cloud.discovery.enabled=true
spring.cloud.gateway.discovery.locator.enabled=true

# ======== Gateway: LoadBalancer Retry Configuration ========
spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.max-attempts=3
spring.cloud.loadbalancer.retry.backoff.first-backoff=200ms
spring.cloud.loadbalancer.retry.backoff.max-backoff=1s

# ======== Gateway: Reactor Netty HTTP Client Settings ========
# connection establishment timeout (ms)
spring.cloud.gateway.httpclient.connect-timeout=3000
# response timeout (seconds)
spring.cloud.gateway.httpclient.response-timeout=5s
# maximum idle time for connections
spring.cloud.gateway.httpclient.pool.max-idle-time=30s
# maximum lifespan of connections
spring.cloud.gateway.httpclient.pool.max-life-time=5m

