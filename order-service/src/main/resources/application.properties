spring.application.name=order-service
server.port=8081

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3307/order-db?serverTimezone=UTC
spring.datasource.username=userName
spring.datasource.password=secret
spring.jpa.show-sql=true

# --- Eureka
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# --- Additional Configurations ---
spring.config.import=optional:classpath:/application-circuitbreaker.properties,\
                      optional:classpath:/application-actuator.properties
