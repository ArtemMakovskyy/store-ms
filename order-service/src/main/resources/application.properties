spring.application.name=order-service
server.port=0

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/order-db?serverTimezone=UTC
spring.datasource.username=userName
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Eureka
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- Additional Configurations ---
spring.config.import=optional:classpath:/application-circuitbreaker.properties,\
                      optional:classpath:/application-actuator.properties
