version: "3.9"
services:
  postgres-product:
    container_name: postgres-product-db
    image: postgres
    environment:
      POSTGRES_DB: product-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-product:/data/postgres
    ports:
      - "5431:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  postgres-order:
    container_name: postgres-order-db
    image: postgres
    environment:
      POSTGRES_DB: order-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-order:/data/postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  postgres-inventory:
    container_name: postgres-inventory-db
    image: postgres
    environment:
      POSTGRES_DB: inventory-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-inventory:/data/postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always
