version: '3.9'
services:

  postgres-product:
    container_name: postgres-product-db
    image: postgres:17
    environment:
      POSTGRES_DB: product-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-product:/data/postgres
    ports:
      - "5431:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userName -d product-db" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  mysql-order:
    container_name: mysql-order-db
    image: mysql:8.3.0
    environment:
      MYSQL_DATABASE: order-db
      MYSQL_USER: userName
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - ./mysql-order/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql-order/data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  postgres-order:
    container_name: postgres-order-db
    image: postgres:17
    environment:
      POSTGRES_DB: order-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-order:/data/postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userName -d order-db" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  postgres-inventory:
    container_name: postgres-inventory-db
    image: postgres:17
    environment:
      POSTGRES_DB: inventory-db
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: secret
      PGDATA: /data/postgres
    volumes:
      - ./postgres-inventory:/data/postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userName -d inventory-db" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s
    restart: always

  mongodb:
    image: mongo:7.0.5
    container_name: mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: userName
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: user-db
    volumes:
      - ./data:/data/db
