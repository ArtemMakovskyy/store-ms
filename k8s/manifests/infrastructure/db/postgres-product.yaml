apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-product
  template:
    metadata:
      labels:
        app: postgres-product
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: product-db
            - name: POSTGRES_USER
              value: userName
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_user_password
            - name: PGDATA
              value: /data/postgres
          volumeMounts:
            - mountPath: /data/postgres
              name: postgres-data
          # Убираем volumeMount для /docker-entrypoint-initdb.d, так как init.sql нет
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-product-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-product-service
spec:
  type: NodePort
  selector:
    app: postgres-product
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 32311
      protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
data:
  postgres_user_password: c2VjcmV0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-product-pv
spec:
  storageClassName: "standard"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/postgres-product
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-product-pvc
spec:
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

